<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simando Law — Case Management System</title>

<!-- Fonts & Bootstrap Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<style>
  :root, [data-theme="dark"] {
    --bg:          #0A0F1E;
    --card:        #111A30;
    --text:        #E8ECF5;
    --head:        #F4F6FB;
    --muted:       #8E9AB5;
    --gold:        #D9B25C;
    --goldtxt:     #F2D58A;
    --ongold:      #1A1405;
    --border:      #1D2948;
    --font-display:'Newsreader', Georgia, serif;
    --font-body:   'Manrope', system-ui, -apple-system, sans-serif;
    --pillar-accent:#FFFFFF;
  }

  [data-theme="light"] {
    --bg:          #F8FAFC;
    --card:        #FFFFFF;
    --text:        #1E293B;
    --head:        #0F172A;
    --muted:       #64748B;
    --gold:        #B8871B;
    --goldtxt:     #855C08;
    --ongold:      #FFFFFF;
    --border:      #E2E8F0;
    --font-display:'Newsreader', Georgia, serif;
    --font-body:   'Manrope', system-ui, -apple-system, sans-serif;
    --pillar-accent:#0F172A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── VIEWPORT LOCK (ZERO SCROLL) ── */
  html, body {
    width: 100%;
    height: 100%;
    max-height: 100vh;
    max-height: 100dvh;
    overflow: hidden !important;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background .25s ease, color .25s ease;
  }

  /* Subtle background radial ambient glow */
  .ambient-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217,178,92,0.08) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top Right Theme Toggle */
  .theme-switch-btn {
    position: absolute;
    top: 24px;
    right: 28px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .2s ease;
    z-index: 10;
  }
  .theme-switch-btn:hover {
    border-color: var(--gold);
    color: var(--goldtxt);
    background: rgba(217,178,92,0.08);
  }

  /* ── CENTER LANDING CARD ── */
  .landing-card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 580px;
    padding: 0 24px;
  }

  .logo-symbol {
    width: 76px;
    height: 76px;
    margin-bottom: 22px;
  }

  .brand-title {
    font-family: var(--font-display);
    font-size: clamp(34px, 4.5vw, 48px);
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--head);
    line-height: 1.05;
    margin-bottom: 4px;
  }

  .brand-subtitle {
    font-family: var(--font-display);
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 600;
    letter-spacing: .24em;
    color: var(--goldtxt);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .brand-tagline {
    font-size: 13.5px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 36px;
  }

  /* Single Action Button */
  .btn-enter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 52px;
    padding: 0 38px;
    border-radius: 14px;
    background: var(--gold);
    color: var(--ongold);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .03em;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(217, 178, 92, 0.35);
    transition: all .2s ease;
  }
  .btn-enter:hover {
    background: var(--goldtxt);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(217, 178, 92, 0.5);
  }
  .btn-enter i {
    font-size: 17px;
    transition: transform .2s ease;
  }
  .btn-enter:hover i {
    transform: translateX(4px);
  }

  /* ── SUBTLE BOTTOM FOOTER ── */
  .landing-footer {
    position: absolute;
    bottom: 20px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
    z-index: 1;
    text-align: center;
  }
</style>
</head>
<body>

<div class="ambient-glow"></div>

<!-- Quick Theme Toggle -->
<button class="theme-switch-btn" onclick="toggleTheme()" title="Switch Theme" aria-label="Toggle Theme">
  <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
</button>

<!-- Center Stage Content -->
<main class="landing-card">
  <!-- Classical Pillar Logo -->
  <div class="logo-symbol" aria-hidden="true">
    <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
      <path d="M6 14 L32 3 L58 14 Z" fill="var(--gold)"/>
      <line x1="2" y1="18" x2="62" y2="18" stroke="var(--gold)" stroke-width="2.5"/>
      <line x1="14" y1="22" x2="14" y2="54" stroke="var(--pillar-accent)" stroke-width="3"/>
      <line x1="23" y1="22" x2="23" y2="54" stroke="var(--gold)" stroke-width="2.5"/>
      <line x1="32" y1="20" x2="32" y2="56" stroke="var(--gold)" stroke-width="3.5"/>
      <line x1="41" y1="22" x2="41" y2="54" stroke="var(--gold)" stroke-width="2.5"/>
      <line x1="50" y1="22" x2="50" y2="54" stroke="var(--pillar-accent)" stroke-width="3"/>
      <line x1="6" y1="58" x2="58" y2="58" stroke="var(--gold)" stroke-width="2.5"/>
      <rect x="2" y="61" width="60" height="5" rx="1" fill="var(--gold)"/>
    </svg>
  </div>

  <h1 class="brand-title">SIMANDO</h1>
  <div class="brand-subtitle">LAW FIRM</div>
  <p class="brand-tagline">Case Management &amp; Litigation System</p>

  <!-- Only Action: Go to Login -->
  <a href="login.html" class="btn-enter">
    <span>Sign In to Portal</span>
    <i class="bi bi-arrow-right"></i>
  </a>
</main>

<footer class="landing-footer">
  &copy; 2026 Simando Law · Naga City, Camarines Sur · Est. 2026
</footer>

<script>
  function initTheme() {
    const saved = localStorage.getItem('simando-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    updateIcon(saved);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('simando-theme', next);
    updateIcon(next);
  }

  function updateIcon(theme) {
    const icon = document.getElementById('theme-icon');
    if (icon) {
      icon.className = theme === 'light' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
  }

  initTheme();
</script>
</body>
</html>
