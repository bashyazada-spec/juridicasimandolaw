<!-- ── CASE FORM (CREATE / EDIT) ── -->
    <div id="view-caseForm" class="view hidden">
      <div class="flex-center gap-10 mb-24">
        <button class="btn btn-ghost" id="cf-back-btn">← Cancel</button>
        <div style="font-size:22px;font-weight:700;color:var(--text)" id="cf-title">New Case</div>
      </div>
      <div class="card" style="max-width:800px">
        <div id="cf-profile-chip" style="display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:20px"></div>
        
        <!-- Row 1: Case Title, Category & Type -->
        <div class="grid2 mb-16">
          <div style="grid-column: 1/-1">
            <label class="field-label">Case Title *</label>
            <input class="field-input" id="cf-case-title" placeholder="e.g. People of the Philippines vs. Dela Cruz"/>
            <div id="cf-title-err" class="field-err hidden">Case title is required</div>
          </div>
          <div>
            <label class="field-label">Category *</label>
            <select class="field-input" id="cf-category" onchange="onCategoryChange(this.value)"></select>
          </div>
          <div>
            <label class="field-label">Case Type / Sub-Category</label>
            <div style="position:relative">
              <input class="field-input" id="cf-type-input" placeholder="Type or select..." oninput="filterCaseTypeSuggestions(this.value)" onfocus="showCaseTypeSuggestions()" onkeydown="onCaseTypeKeydown(event)"/>
              <div id="cf-type-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:180px;overflow-y:auto;box-shadow:var(--shadow)"></div>
            </div>
          </div>
        </div>

        <!-- Row 2: Date Filed & Docket Number -->
        <div class="grid2 mb-16">
          <div>
            <label class="field-label">Date Case Filed *</label>
            <input type="date" class="field-input" id="cf-filed"/>
            <div id="cf-filed-err" class="field-err hidden">Filed date is required</div>
          </div>
          <div>
            <label class="field-label">Case / Docket Number</label>
            <input class="field-input" id="cf-case-number" placeholder="e.g. Civil Case No. 2026-104"/>
          </div>
        </div>

        <!-- Row 3: Status & Venue -->
        <div class="grid2 mb-16">
          <div>
            <label class="field-label">Status</label>
            <select class="field-input" id="cf-status"></select>
          </div>
          <div>
            <label class="field-label">Venue / Court</label>
            <select class="field-input" id="cf-venue" onchange="onVenueChange(this)"></select>
            <input class="field-input mt-16" id="cf-venue-manual" placeholder="Specify other venue..." style="display:none"/>
          </div>
        </div>

        <!-- Row 4: Parties Involved Box -->
        <div class="card mb-16" style="background:var(--surface2);padding:18px">
          <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">Parties Involved *</div>
          <input type="hidden" id="cf-parties"/>
          
          <div class="grid2 mb-12">
            <div>
              <label class="field-label" id="cf-party-a-label">Petitioner / Plaintiff</label>
              <div style="display:flex;gap:6px">
                <input class="field-input" id="cf-petitioner-input" placeholder="Name..." onkeydown="if(event.key==='Enter'){event.preventDefault();addParty('petitioner');}"/>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addParty('petitioner')">+</button>
              </div>
              <div id="cf-petitioners-list" style="margin-top:8px"></div>
            </div>
            <div>
              <label class="field-label" id="cf-party-b-label">Respondent / Defendant</label>
              <div style="display:flex;gap:6px">
                <input class="field-input" id="cf-respondent-input" placeholder="Name..." onkeydown="if(event.key==='Enter'){event.preventDefault();addParty('respondent');}"/>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addParty('respondent')">+</button>
              </div>
              <div id="cf-respondents-list" style="margin-top:8px"></div>
            </div>
          </div>
          <div id="cf-parties-err" class="field-err hidden">At least one party on both sides is required</div>
        </div>

        <!-- Row 5: Optional Fields placed directly UNDER Parties Involved -->
        <div class="grid2 mb-16">
          <div>
            <label class="field-label">Due Date / Next Hearing (Optional)</label>
            <input type="date" class="field-input" id="cf-due"/>
          </div>
          <div>
            <label class="field-label">Document Type / Subtype (Optional)</label>
            <input class="field-input" id="cf-doc-type" placeholder="e.g. Complaint, Answer, Motion"/>
          </div>
        </div>

        <!-- Row 6: Narrative / Summary -->
        <div class="mb-16">
          <label class="field-label">Case Narrative / Summary *</label>
          <textarea class="field-input" id="cf-narrative" rows="4" placeholder="Briefly summarize the background, claims, and current posture of the case..."></textarea>
          <div id="cf-narrative-err" class="field-err hidden">Narrative summary is required</div>
        </div>

        <!-- Row 7: Document Upload -->
        <div class="card mb-20" style="background:var(--surface2);padding:18px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-size:13px;font-weight:700;color:var(--text)">Attach Documents</span>
            <span id="drive-status" style="font-size:11px;color:var(--text-dim)"></span>
          </div>
          
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer">
              <input type="radio" name="cf-file-type" value="Inbound" checked style="accent-color:var(--gold)"/> 📥 Inbound
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer">
              <input type="radio" name="cf-file-type" value="Outbound" style="accent-color:var(--gold)"/> 📤 Outbound
            </label>
          </div>

          <div class="upload-area" onclick="triggerLocalAttach()">
            <div style="font-size:24px;margin-bottom:4px">📁</div>
            <div>Click to select files from your computer</div>
          </div>
          <input type="file" id="local-file-input" multiple style="display:none" onchange="handleLocalAttach(event)"/>
          
          <div id="cf-docs-list" style="margin-top:12px"></div>
        </div>

        <!-- Actions -->
        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button class="btn btn-ghost" id="cf-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="cf-save-btn" onclick="saveCase()">Add Case</button>
        </div>
      </div>
    </div>
