<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simando Law — Admin Console</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<script type="module" src="js/firebase-init.js"></script>
<base target="_blank">

<style>
  /* Admin-specific style overrides and components */
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  .admin-table th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 2px solid var(--border);
    letter-spacing: 1px;
  }
  .admin-table td {
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .admin-table tr:hover td {
    background-color: var(--surface2);
  }
</style>
</head>
<body>

<!-- Toast Alert -->
<div id="toast"></div>

<!-- Initial Security Verification Screen -->
<div id="loading-screen" style="position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div class="spinner"></div>
  <div style="font-size:14px;color:var(--text-muted);font-weight:500" id="gate-message">Verifying Admin Authorization...</div>
</div>

<div id="app">

  <!-- ══════ SIDEBAR ══════ -->
  <div id="sidebar">
    <div class="logo-wrap">
      <svg class="logo-img" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="80" height="100" rx="4" fill="none" stroke="#c9a84c" stroke-width="2"/>
        <line x1="50" y1="20" x2="50" y2="100" stroke="#c9a84c" stroke-width="2"/>
        <circle cx="30" cy="45" r="12" fill="none" stroke="#c9a84c" stroke-width="2"/>
        <circle cx="70" cy="45" r="12" fill="none" stroke="#c9a84c" stroke-width="2"/>
        <line x1="30" y1="57" x2="30" y2="75" stroke="#c9a84c" stroke-width="2"/>
        <line x1="70" y1="57" x2="70" y2="75" stroke="#c9a84c" stroke-width="2"/>
        <polygon points="50,75 30,95 70,95" fill="#c9a84c" opacity="0.4"/>
        <text x="110" y="55" font-family="serif" font-size="32" font-weight="700" fill="#f2ede4">SIMANDO</text>
        <text x="110" y="80" font-family="serif" font-size="20" font-weight="600" fill="#c9a84c">LAW</text>
        <text x="110" y="100" font-family="sans-serif" font-size="9" letter-spacing="3" fill="#c9a84c" opacity="0.6">ADMIN SYSTEM</text>
      </svg>
      <div class="logo-sub">Firm Control Center</div>
    </div>
    <div style="flex:1">
      <div class="nav-section">Controls</div>
      <button class="nav-btn active">👥&nbsp;&nbsp;Attorney Database</button>
    </div>
    <div class="sidebar-footer">
      <a href="index.html" target="_self" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;margin-bottom:12px;color:var(--gold-light)">↩ Return to CMS</a>
      Simando Law Admin v1.0
    </div>
  </div>

  <!-- ══════ MAIN CONTENT ══════ -->
  <div id="main">

    <!-- ATTORNEY DATABASE PANEL -->
    <div id="tab-attorneys" class="admin-tab">
      <div class="page-hdr">
        <div>
          <div class="page-title">Attorney Directory</div>
          <div class="page-sub" id="admin-directory-sub">Managing firm access profiles</div>
        </div>
      </div>
      <div class="card">
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Attorney</th>
                <th>Email Address</th>
                <th>Role / Designation</th>
                <th>Google Drive Storage</th>
                <th>Action Controls</th>
              </tr>
            </thead>
            <tbody id="admin-attorney-tbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>

<!-- Security Verification and Directory Load Script -->
<script type="module">
  import { getFirestore, doc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  let db, auth;
  let adminProfiles = [];

  document.addEventListener("firebase-ready", async () => {
    db = window._db;
    auth = window._auth;

    if (!auth) {
      bounceUser("Identity Provider Connection Error");
      return;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        bounceUser("Please sign in first.");
        return;
      }

      try {
        // Verify current attorney profile has administrative access
        const docRef = doc(db, "profiles", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists() && docSnap.data().role === "admin") {
          const loader = document.getElementById("loading-screen");
          if (loader) loader.style.display = "none";
          showToast("Admin Session Verified");
          initAdminConsole();
        } else {
          // Robust fallback search for custom claims/overwritten profiles
          const q = query(collection(db, "profiles"));
          const snap = await getDocs(q);
          const matched = snap.docs.find(d => d.data().ownerUid === user.uid && d.data().role === "admin");
          
          if (matched) {
            const loader = document.getElementById("loading-screen");
            if (loader) loader.style.display = "none";
            showToast("Admin Session Verified");
            initAdminConsole();
          } else {
            bounceUser("Unauthorized. You do not possess administrative permissions.");
          }
        }
      } catch (err) {
        console.error("Admin verification failed:", err);
        bounceUser("Security verification failed: " + err.message);
      }
    });
  });

  function bounceUser(msg) {
    const el = document.getElementById("gate-message");
    if (el) el.innerHTML = `<span style="color:var(--red)">❌ ${msg}</span><br><br><a href="index.html" target="_self" style="color:var(--gold);text-decoration:underline;font-size:12px">Return to Case Manager</a>`;
    showToast(msg, "error");
    setTimeout(() => {
      window.location.replace("index.html");
    }, 2800);
  }

  // ═══════════════════════════════════════════════════════════════
  //  DIRECTORY RENDERERS
  // ═══════════════════════════════════════════════════════════════
  async function initAdminConsole() {
    await loadDirectoryProfiles();
    renderAttorneyDirectory();
  }

  async function loadDirectoryProfiles() {
    try {
      const pSnap = await getDocs(collection(db, "profiles"));
      adminProfiles = pSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const subEl = document.getElementById("admin-directory-sub");
      if (subEl) {
        subEl.textContent = `${adminProfiles.length} active directory profile${adminProfiles.length !== 1 ? 's' : ''}`;
      }
    } catch (err) {
      console.error("Error loading administrative directory:", err);
      showToast("Directory sync warning. Some profiles could not be loaded.", "error");
    }
  }

  function renderAttorneyDirectory() {
    const tbody = document.getElementById("admin-attorney-tbody");
    if (!tbody) return;

    if (adminProfiles.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">No active profiles found.</td></tr>`;
      return;
    }

    tbody.innerHTML = adminProfiles.map(p => {
      const isAdminProfile = p.role === "admin";
      return `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:12px">
              ${avatarDiv(p.name, p.avatarColor, 34, p.photoUrl)}
              <div>
                <div style="font-weight:600;font-size:14px">${p.name}</div>
                <div style="font-size:11px;color:var(--text-dim)">Registered Profile</div>
              </div>
            </div>
          </td>
          <td>${p.email || "N/A"}</td>
          <td>
            <span style="font-size:12px;font-weight:600;color:${isAdminProfile ? 'var(--gold)' : 'var(--text-muted)'}">
              ${isAdminProfile ? "Firm Administrator 🛡️" : (p.role || "Attorney")}
            </span>
          </td>
          <td>
            ${p.driveFolderId 
              ? `<a href="https://drive.google.com/drive/folders/${p.driveFolderId}" target="_blank" style="color:var(--green);font-size:12px;text-decoration:underline">📁 View Drive Folder →</a>`
              : `<span style="color:var(--amber);font-size:12px">⚠ Folder Unlinked</span>`}
          </td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="adminDeleteProfile('${p.id}', '${p.name.replace(/'/g, "\\'")}')">Remove Account</button>
          </td>
        </tr>
      `;
    }).join("");
  }

  window.adminDeleteProfile = async function(profileId, name) {
    if (!confirm(`Are you absolutely sure you want to delete profile: ${name}?\nThis action is permanent and cannot be undone.`)) return;

    try {
      showToast("Removing directory entry...");
      await deleteDoc(doc(db, "profiles", profileId));
      showToast("Profile successfully removed from directory.");
      await loadDirectoryProfiles();
      renderAttorneyDirectory();
    } catch (err) {
      console.error(err);
      showToast("Profile removal failed: " + err.message, "error");
    }
  };
</script>
</body>
</html>
