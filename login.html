<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simando Law — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:        #b8905a;
      --gold-light:  #d3ac7b;
      --gold-pale:   #ecdcc4;
      --gold-dim:    rgba(184,144,90,0.08);
      --gold-border: rgba(184,144,90,0.30);
      --gold-border2:rgba(184,144,90,0.16);
      --bg:          #0d0d0f;
      --surface:     #17181b;
      --surface2:    #1b1c20;
      --border:      #26272b;
      --border-soft: #2c2d32;
      --text:        #ebeae7;
      --text-muted:  #8d8d93;
      --text-dim:    #57575d;
      --red:         #f27272;
      --font-display:'Cormorant Garamond', Georgia, serif;
      --font-body:   'DM Sans', system-ui, sans-serif;
      --radius:      8px;
      --radius-lg:   12px;
      --shadow:      0 16px 40px rgba(0,0,0,0.4);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px 36px;
      box-shadow: var(--shadow);
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 30px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1; }
    .logo-name {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .logo-sub {
      font-size: 9px; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-dim); margin-top: 4px;
    }

    /* ── Heading ── */
    .heading { margin-bottom: 26px; }
    .heading h1 {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }
    .heading p {
      font-size: 13px; color: var(--text-muted);
      margin-top: 6px; line-height: 1.5;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 14px; opacity: 0.4; pointer-events: none;
    }
    .input-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 14px; opacity: 0.4; padding: 4px;
      color: var(--text-muted); transition: opacity 0.15s;
    }
    .input-toggle:hover { opacity: 0.8; }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 10px 38px 10px 36px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-dim);
    }
    input.err { border-color: rgba(242,114,114,0.5); }
    input::placeholder { color: var(--text-dim); }

    .field-err {
      font-size: 11px; color: var(--red);
      margin-top: 5px; display: none;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      background: var(--gold);
      border: none; border-radius: var(--radius);
      color: #0d0d0f;
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.01em;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--gold-light); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Error banner ── */
    .error-banner {
      background: transparent;
      border: 1px solid rgba(242,114,114,0.3);
      border-radius: var(--radius);
      color: #f7a8a8;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-banner.show { display: block; }

    /* ── Footer links ── */
    .footer-links {
      margin-top: 22px; text-align: center;
      font-size: 12px; color: var(--text-muted);
    }
    .footer-links a {
      color: var(--gold); text-decoration: none;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--gold-light); }

    /* ── Spinner ── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(13,13,15,0.3);
      border-top-color: #0d0d0f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">⚖️</div>
    <div class="logo-text">
      <span class="logo-name">Simando Law</span>
      <span class="logo-sub">Case Management System</span>
    </div>
  </div>

  <div class="heading">
    <h1 id="heading-title">Welcome back</h1>
    <p id="heading-sub">Sign in to access your case management dashboard.</p>
  </div>

  <div id="error-banner" class="error-banner"></div>

  <!-- Email + Password form -->
  <div class="form-group">
    <label for="inp-email">Email address</label>
    <div class="input-wrap">
      <span class="input-icon">✉</span>
      <input type="email" id="inp-email" placeholder="attorney@simandolaw.com" autocomplete="email"/>
    </div>
    <div class="field-err" id="err-email"></div>
  </div>

  <div class="form-group">
    <label for="inp-password">Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="input-toggle" onclick="togglePassword()" id="pw-toggle" title="Show/hide password">👁</button>
    </div>
    <div class="field-err" id="err-password"></div>
  </div>

  <button class="btn-primary" id="email-btn" onclick="handleEmailAuth()">
    <span id="email-btn-text">Sign In</span>
  </button>

  <div class="footer-links" id="footer-links">
    <a href="#" onclick="handleForgotPassword(); return false;" id="forgot-link">Forgot password?</a>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDIDs21G2wWy-Wd72wb-iWNMCTy0_KlADo",
    authDomain: "simando.firebaseapp.com",
    projectId: "simando",
    storageBucket: "simando.firebasestorage.app",
    messagingSenderId: "625959608817",
    appId: "1:625959608817:web:0c571d94f720658e97a450"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, user => {
    if (user) window.location.replace("index.html");
  });

  window.togglePassword = function() {
    const inp = document.getElementById("inp-password");
    inp.type = inp.type === "password" ? "text" : "password";
  };

  function showError(msg) {
    const el = document.getElementById("error-banner");
    el.textContent = msg;
    el.classList.add("show");
  }

  function clearErrors() {
    document.getElementById("error-banner").classList.remove("show");
    ["inp-email","inp-password"].forEach(id => document.getElementById(id).classList.remove("err"));
  }

  function setLoading(loading) {
    const emailBtn  = document.getElementById("email-btn");
    const btnText   = document.getElementById("email-btn-text");
    emailBtn.disabled  = loading;
    if (loading) {
      btnText.innerHTML = `<span class="spinner"></span>`;
    } else {
      btnText.textContent = "Sign In";
    }
  }

  function friendlyError(code) {
    const map = {
      "auth/user-not-found":       "No account found with this email.",
      "auth/wrong-password":       "Incorrect password. Please try again.",
      "auth/invalid-credential":   "Incorrect email or password.",
      "auth/invalid-email":        "Please enter a valid email address.",
      "auth/too-many-requests":    "Too many attempts. Please wait a moment and try again.",
      "auth/network-request-failed": "Network error. Check your connection.",
    };
    return map[code] || "Something went wrong. Please try again.";
  }

  window.handleEmailAuth = async function() {
    clearErrors();
    const email    = document.getElementById("inp-email").value.trim();
    const password = document.getElementById("inp-password").value;
    let valid = true;

    if (!email) {
      document.getElementById("inp-email").classList.add("err");
      valid = false;
    }
    if (!password) {
      document.getElementById("inp-password").classList.add("err");
      valid = false;
    }
    if (!valid) return;

    setLoading(true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      setLoading(false);
      showError(friendlyError(err.code));
    }
  };

  window.handleForgotPassword = async function() {
    const email = document.getElementById("inp-email").value.trim();
    if (!email) {
      document.getElementById("inp-email").classList.add("err");
      showError("Enter your email address above first.");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showError("✓ Password reset email sent — check your inbox.");
      document.getElementById("error-banner").style.background = "rgba(52,211,153,0.08)";
      document.getElementById("error-banner").style.borderColor = "rgba(52,211,153,0.25)";
      document.getElementById("error-banner").style.color = "#6ee7b7";
    } catch (err) {
      showError(friendlyError(err.code));
    }
  };

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") window.handleEmailAuth();
  });
</script>
</body>
</html>
