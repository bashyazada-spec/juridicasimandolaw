<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simando Law — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #0a1520;
      --gold:        #c9a55c;
      --gold-light:  #e0c080;
      --gold-pale:   #f5e6c4;
      --gold-dim:    rgba(201,165,92,0.09);
      --gold-border: rgba(201,165,92,0.26);
      --gold-border2:rgba(201,165,92,0.14);
      --bg:          #060c13;
      --bg2:         #08111a;
      --surface:     #0c1826;
      --surface2:    #091422;
      --border:      #162033;
      --border-soft: #1c2d3f;
      --text:        #d8e4f0;
      --text-muted:  #6b82a0;
      --text-dim:    #344556;
      --red:         #f87171;
      --font-display:'Cormorant Garamond', Georgia, serif;
      --font-body:   'DM Sans', system-ui, sans-serif;
      --radius:      10px;
      --radius-lg:   16px;
      --shadow:      0 12px 48px rgba(0,0,0,0.6);
      --shadow-gold: 0 4px 24px rgba(201,165,92,0.18);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Atmospheric background ── */
    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-gradient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,165,92,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(10,21,32,0.8) 0%, transparent 70%),
        linear-gradient(160deg, #060c13 0%, #08111a 50%, #060a10 100%);
    }
    .bg-grid {
      position: absolute; inset: 0; opacity: 0.025;
      background-image:
        linear-gradient(rgba(201,165,92,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,165,92,0.5) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat 12s ease-in-out infinite;
    }
    .bg-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(201,165,92,0.07) 0%, transparent 70%);
      top: -200px; left: -100px;
      animation-delay: 0s;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(10,21,32,0.9) 0%, transparent 70%);
      bottom: -150px; right: -100px;
      animation-delay: -6s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(30px, -20px) scale(1.05); }
      66%       { transform: translate(-20px, 15px) scale(0.97); }
    }

    /* ── Scale lines (decorative) ── */
    .scale-line {
      position: absolute;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(201,165,92,0.15), transparent);
      animation: scalePulse 4s ease-in-out infinite;
    }
    .scale-line-l { height: 200px; top: 50%; left: 10%; transform: translateY(-50%); animation-delay: 0s; }
    .scale-line-r { height: 200px; top: 50%; right: 10%; transform: translateY(-50%); animation-delay: -2s; }
    @keyframes scalePulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.8; }
    }

    /* ── Card ── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      margin: 1rem;
      background: linear-gradient(145deg, rgba(12,24,38,0.95) 0%, rgba(8,17,26,0.98) 100%);
      border: 1px solid var(--gold-border2);
      border-radius: 20px;
      padding: 44px 40px 40px;
      box-shadow: var(--shadow), 0 0 0 1px rgba(201,165,92,0.05), inset 0 1px 0 rgba(201,165,92,0.08);
      animation: cardReveal 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Corner accents ── */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.4;
    }
    .card::before { top: 16px; left: 16px; border-width: 1px 0 0 1px; border-radius: 4px 0 0 0; }
    .card::after  { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; border-radius: 0 0 4px 0; }

    /* ── Logo ── */
    .logo-wrap {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
      animation: fadeUp 0.6s 0.15s both;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1; }
    .logo-name {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 600;
      color: var(--gold-pale);
      letter-spacing: 0.04em;
    }
    .logo-sub {
      font-size: 9px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-muted); margin-top: 3px;
    }

    /* ── Heading ── */
    .heading {
      animation: fadeUp 0.6s 0.2s both;
      margin-bottom: 28px;
    }
    .heading h1 {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 500;
      color: var(--text);
      letter-spacing: 0.01em;
      line-height: 1.2;
    }
    .heading p {
      font-size: 13px; color: var(--text-muted);
      margin-top: 6px; line-height: 1.5;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 16px;
      animation: fadeUp 0.6s both;
    }
    .form-group:nth-child(1) { animation-delay: 0.25s; }
    .form-group:nth-child(2) { animation-delay: 0.30s; }

    label {
      display: block;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 15px; opacity: 0.45; pointer-events: none;
    }
    .input-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 15px; opacity: 0.4; padding: 4px;
      color: var(--text-muted); transition: opacity 0.2s;
    }
    .input-toggle:hover { opacity: 0.8; }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(6,12,19,0.7);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 11px 40px 11px 38px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus {
      border-color: var(--gold-border);
      background: rgba(201,165,92,0.03);
      box-shadow: 0 0 0 3px rgba(201,165,92,0.07);
    }
    input.err { border-color: rgba(248,113,113,0.5); }
    input::placeholder { color: var(--text-dim); }

    .field-err {
      font-size: 11px; color: var(--red);
      margin-top: 5px; display: none;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #c9a55c 0%, #b8913f 100%);
      border: none; border-radius: var(--radius);
      color: #060c13;
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.03em;
      padding: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: var(--shadow-gold);
      animation: fadeUp 0.6s 0.4s both;
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(201,165,92,0.28);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Error banner ── */
    .error-banner {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: var(--radius);
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
      animation: shake 0.4s ease;
    }
    .error-banner.show { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    /* ── Footer links ── */
    .footer-links {
      margin-top: 24px; text-align: center;
      font-size: 12px; color: var(--text-muted);
      animation: fadeUp 0.6s 0.5s both;
    }
    .footer-links a {
      color: var(--gold); text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--gold-light); }

    /* ── Spinner ── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(6,12,19,0.3);
      border-top-color: #060c13;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="scale-line scale-line-l"></div>
  <div class="scale-line scale-line-r"></div>
</div>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">⚖️</div>
    <div class="logo-text">
      <span class="logo-name">Simando Law</span>
      <span class="logo-sub">Case Management System</span>
    </div>
  </div>

  <div class="heading">
    <h1 id="heading-title">Welcome back</h1>
    <p id="heading-sub">Sign in to access your case management dashboard.</p>
  </div>

  <div id="error-banner" class="error-banner"></div>

  <!-- Email + Password form -->
  <div class="form-group">
    <label for="inp-email">Email address</label>
    <div class="input-wrap">
      <span class="input-icon">✉</span>
      <input type="email" id="inp-email" placeholder="attorney@simandolaw.com" autocomplete="email"/>
    </div>
    <div class="field-err" id="err-email"></div>
  </div>

  <div class="form-group">
    <label for="inp-password">Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="input-toggle" onclick="togglePassword()" id="pw-toggle" title="Show/hide password">👁</button>
    </div>
    <div class="field-err" id="err-password"></div>
  </div>

  <button class="btn-primary" id="email-btn" onclick="handleEmailAuth()">
    <span id="email-btn-text">Sign In</span>
  </button>

  <div class="footer-links" id="footer-links">
    <a href="#" onclick="handleForgotPassword(); return false;" id="forgot-link">Forgot password?</a>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDIDs21G2wWy-Wd72wb-iWNMCTy0_KlADo",
    authDomain: "simando.firebaseapp.com",
    projectId: "simando",
    storageBucket: "simando.firebasestorage.app",
    messagingSenderId: "625959608817",
    appId: "1:625959608817:web:0c571d94f720658e97a450"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, user => {
    if (user) window.location.replace("index.html");
  });

  window.togglePassword = function() {
    const inp = document.getElementById("inp-password");
    inp.type = inp.type === "password" ? "text" : "password";
  };

  function showError(msg) {
    const el = document.getElementById("error-banner");
    el.textContent = msg;
    el.classList.add("show");
    el.style.animation = "none";
    requestAnimationFrame(() => { el.style.animation = "shake 0.4s ease"; });
  }

  function clearErrors() {
    document.getElementById("error-banner").classList.remove("show");
    ["inp-email","inp-password"].forEach(id => document.getElementById(id).classList.remove("err"));
  }

  function setLoading(loading) {
    const emailBtn  = document.getElementById("email-btn");
    const btnText   = document.getElementById("email-btn-text");
    emailBtn.disabled  = loading;
    if (loading) {
      btnText.innerHTML = `<span class="spinner"></span>`;
    } else {
      btnText.textContent = "Sign In";
    }
  }

  function friendlyError(code) {
    const map = {
      "auth/user-not-found":       "No account found with this email.",
      "auth/wrong-password":       "Incorrect password. Please try again.",
      "auth/invalid-credential":   "Incorrect email or password.",
      "auth/invalid-email":        "Please enter a valid email address.",
      "auth/too-many-requests":    "Too many attempts. Please wait a moment and try again.",
      "auth/network-request-failed": "Network error. Check your connection.",
    };
    return map[code] || "Something went wrong. Please try again.";
  }

  window.handleEmailAuth = async function() {
    clearErrors();
    const email    = document.getElementById("inp-email").value.trim();
    const password = document.getElementById("inp-password").value;
    let valid = true;

    if (!email) {
      document.getElementById("inp-email").classList.add("err");
      valid = false;
    }
    if (!password) {
      document.getElementById("inp-password").classList.add("err");
      valid = false;
    }
    if (!valid) return;

    setLoading(true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      setLoading(false);
      showError(friendlyError(err.code));
    }
  };

  window.handleForgotPassword = async function() {
    const email = document.getElementById("inp-email").value.trim();
    if (!email) {
      document.getElementById("inp-email").classList.add("err");
      showError("Enter your email address above first.");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showError("✓ Password reset email sent — check your inbox.");
      document.getElementById("error-banner").style.background = "rgba(52,211,153,0.08)";
      document.getElementById("error-banner").style.borderColor = "rgba(52,211,153,0.25)";
      document.getElementById("error-banner").style.color = "#6ee7b7";
    } catch (err) {
      showError(friendlyError(err.code));
    }
  };

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") window.handleEmailAuth();
  });
</script>
</body>
</html>
